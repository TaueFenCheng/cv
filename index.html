<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 文件预览</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        * { box-sizing: border-box; }

        body { margin: 0; min-height: 100vh; }

        .toolbar {
            align-items: center;
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            padding: 14px 20px;
        }

        .title { margin: 0; font-size: 18px; }

        .actions { display: flex; flex-wrap: wrap; gap: 8px; }

        button, .file-label {
            background: #2563eb;
            border: 0;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font: inherit;
            padding: 9px 14px;
        }

        button.secondary { background: #e5e7eb; color: #374151; }
        button:hover, .file-label:hover { filter: brightness(.95); }
        input[type="file"] { display: none; }

        .status { color: #6b7280; font-size: 13px; margin: 0 20px; }

        .preview {
            background: #dfe3e8;
            height: calc(100vh - 98px);
            min-height: 420px;
            padding: 20px;
        }

        iframe {
            background: #fff;
            border: 0;
            border-radius: 6px;
            box-shadow: 0 4px 18px rgb(15 23 42 / 12%);
            display: block;
            height: 100%;
            margin: 0 auto;
            max-width: 1200px;
            width: 100%;
        }

        @media (max-width: 640px) {
            .toolbar { padding: 12px; }
            .status { margin: 0 12px; }
            .preview { height: calc(100vh - 136px); padding: 10px; }
        }
    </style>
</head>
<body>
    <header class="toolbar">
        <h1 class="title">HTML 文件预览</h1>
        <div class="actions">
            <label class="file-label" for="file-input">选择 HTML 文件</label>
            <input id="file-input" type="file" accept=".html,.htm,text/html">
            <button id="reload-button" class="secondary" type="button">重新加载</button>
            <button id="open-button" type="button">新窗口打开</button>
        </div>
    </header>
    <p id="status" class="status">正在预览 cv.html</p>
    <main class="preview">
        <iframe id="preview-frame" src="cv.html" title="HTML 文件预览"></iframe>
    </main>

    <script>
        const frame = document.querySelector('#preview-frame');
        const fileInput = document.querySelector('#file-input');
        const reloadButton = document.querySelector('#reload-button');
        const openButton = document.querySelector('#open-button');
        const status = document.querySelector('#status');
        let currentUrl = 'cv.html';
        let selectedObjectUrl = null;

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (!file) return;

            if (selectedObjectUrl) URL.revokeObjectURL(selectedObjectUrl);
            selectedObjectUrl = URL.createObjectURL(file);
            currentUrl = selectedObjectUrl;
            frame.src = currentUrl;
            status.textContent = `正在预览 ${file.name}`;
        });

        reloadButton.addEventListener('click', () => {
            frame.src = currentUrl;
        });

        openButton.addEventListener('click', () => {
            window.open(currentUrl, '_blank', 'noopener,noreferrer');
        });

        window.addEventListener('beforeunload', () => {
            if (selectedObjectUrl) URL.revokeObjectURL(selectedObjectUrl);
        });
    </script>
</body>
</html>
